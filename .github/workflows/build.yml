name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./build.sh --no-install
      - name: Check the bundle
        run: |
          test -x build/Serit.app/Contents/MacOS/Serit
          codesign --verify --verbose build/Serit.app
          plutil -lint build/Serit.app/Contents/Info.plist
